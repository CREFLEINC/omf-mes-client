name: 착수 가능 통지 (설계 → 프론트)
description: 화면 한 개를 프론트에서 착수해도 된다고 알린다. 스펙 내용이 아니라 신호와 포인터만 적는다.
title: '[uiux→client] 착수 가능 — '
labels:
  - 'uiux→client'
  - 'ready'
body:
  - type: markdown
    attributes:
      value: |
        ## ⚠ 여기는 공개(public) 저장소다 — 스펙 본문을 붙이지 않는다

        `omf-mes-client`는 누구나 볼 수 있는 공개 저장소다. 이슈의 **제목 · 본문 · 첨부 · 라벨 · 수정 이력**이 전부 함께 공개된다.
        나중에 지워도 인덱싱된 사본과 포크는 회수되지 않는다.

        | ✅ 적어도 되는 것 | ⛔ 적으면 안 되는 것 |
        | --- | --- |
        | 화면 ID(`W-06-03`) · 화면 이름 · 라우트 · 컴포넌트명 | 설계·기획 문서의 **본문 복사 · 발췌 · 요약** |
        | 설계 저장소 이슈 번호 (`omf-mes#42`) | **이미지** — 와이어프레임 · 화면 캡처 · 워크플로우 도식 |
        | 문서의 **경로와 개정일** 같은 포인터 | 고객사명 · 공장/사업장 위치 · 담당자 실명 · 조직도 |
        | MES 일반 업무 용어 (자재LOT · W/O · 특채 승인) | 실 사번 · 품목코드 · LOT 번호 · 거래처 코드 → **합성값을 쓴다** |
        | 직접 지어낸 합성 예시값 | 금액 · 수량 · 단가 · 납기 등 계약·견적 정보 |

        **내용은 옮기지 말고 번호로 참조한다** — ✅ `근거: omf-mes#42` / ⛔ 스펙 문장 붙여넣기

        실수로 올렸다면 **조용히 지우지 말고 즉시 알린다.** 공개 저장소에서는 올린 순간 노출된 것으로 본다.

        ---

        규칙 전문은 [`docs/uiux-handoff.md`](https://github.com/CREFLEINC/omf-mes-client/blob/main/docs/uiux-handoff.md)에 있다. **한 이슈 = 한 화면**이다.

  - type: input
    id: screen
    attributes:
      label: 1. 화면 ID · 이름
      description: 한 이슈에 한 화면만 적는다. 화면이 여러 개면 이슈를 나눈다.
      placeholder: W-06-03 · 코드값 관리
    validations:
      required: true

  - type: dropdown
    id: resource-pattern
    attributes:
      label: 1-2. 리소스 패턴
      description: 프론트가 어떤 화면 골격과 공용 부품을 재사용할지 정하는 값이다.
      options:
        - 마스터 형 — 목록 + 등록/수정 + 사용 중지
        - 버전 마스터 형 — 마스터에 버전·이력이 붙는다
        - 조회 형 — 읽기 전용 목록·상세
        - 입력 형 — 실적·전표 등 입력 중심
    validations:
      required: true

  - type: textarea
    id: basis
    attributes:
      label: 2. 근거 — 무엇을 보고 판단했는가
      description: >-
        경로·버전·번호 같은 **포인터만** 적고 문서 본문은 옮기지 않는다.
        디자인 시스템은 「이슈가 닫혔다」가 아니라 **고정한 커밋의 설치본에서 실물을 확인한** 결과를 적는다 —
        이슈가 닫힌 것과 우리가 쓰는 커밋에 들어 있는 것은 서로 다른 사실이다.
      placeholder: |
        - 화면 스펙: design/wiki/screens/06/W-06-03.md (개정 2026-08-05)
        - 계약 정본: design/wiki/api-contracts/openapi/mdm-기준정보.json (2026-08-05판)
        - 공유계약: design/wiki/decisions-policy/공유계약.md v0.6
        - 디자인 시스템: design-system-v2-webui 커밋 a554d11 기준으로 인벤토리 실물 확인
    validations:
      required: true

  - type: input
    id: checked-at
    attributes:
      label: 2-2. 확인 시점
      description: >-
        위 근거를 **언제 기준으로** 확인했는지 날짜로 적는다.
        문서는 전달한 순간 고정되지만 계약·디자인 시스템·이슈는 그 뒤로도 움직인다.
        이 이슈가 **언제의 상태를 담은 판단인지**가 남아야, 나중에 무언가 바뀌었을 때
        프론트가 무엇을 다시 확인해야 하는지 알 수 있다.
      # 따옴표를 벗기면 YAML 이 날짜(timestamp)로 해석해 문자열이 아니게 된다
      placeholder: '2026-08-07'
    validations:
      required: true

  - type: checkboxes
    id: settled
    attributes:
      label: 3. 확정된 것 — 이 화면에서 더 바뀌지 않는 것
      description: 체크한 항목은 「프론트가 이대로 구현해도 된다」는 뜻이다. **체크하지 않은 항목은 4번 미결 표에 적는다.**
      options:
        - label: '**필드 목록** — 화면에 놓일 항목과 표시 순서'
        - label: '**검증 규칙** — 필수 · 형식 · 길이 · 조건부 필수 · 짝 제약'
        - label: '**예외 표시** — 오류 · 경고 · 빈 상태 · 권한 없음의 문구와 위치'
        - label: '**화면 전이** — 어디서 들어오고 어디로 나가는가'
        - label: '**엔드포인트 존재** — 계약 정본에 필요한 오퍼레이션이 모두 있다'

  - type: textarea
    id: open-items
    attributes:
      label: 4. 미결 항목 — 확정되지 않은 것과 그 처리 방법
      description: >-
        **이 폼에서 가장 중요한 칸이다.** 이 칸이 비면 프론트가 미결을 혼자 판단하게 되고,
        그 판단은 설계와 어긋난 채로 코드에 굳는다. 실제로 그 사고가 있었다.


        「이번에 어떻게 처리」는 반드시 다음 셋 중 하나로 적는다.

        1. **만들지 않는다** — 해당 UI를 이번 범위에서 뺀다

        2. **자리표시 상수 + 안내** — 값을 프론트 상수 한 곳에 모으고 화면에 임시임을 알린다

        3. **비활성 + 사유 표시** — 요소는 두되 비활성화하고 왜 못 쓰는지 보여 준다


        미결이 없으면 `없음` 한 단어만 적는다. 미결이 있어도 **처리 방법만 적혀 있으면 착수할 수 있다.**
      placeholder: |
        | 항목 | 왜 미결 | 이번에 어떻게 처리 | 추적 번호 |
        | --- | --- | --- | --- |
        | 코드 그룹 선택지 | 코드값 목록이 확정 전 | 자리표시 상수 + 안내 — 프론트 상수 한 곳에 모으고 「임시 목록」 표시 | omf-mes#64 |
        | 첨부 미리보기 | 저장 방식 미정 | 만들지 않는다 — 파일명만 표시 | omf-mes#71 |
        | 승인 반려 버튼 | 권한 규칙 미정 | 비활성 + 사유 표시 — 「권한 규칙 확정 후 활성」 | omf-mes#72 |
    validations:
      required: true

  - type: textarea
    id: sequence
    attributes:
      label: 5. 선행·순서 — 먼저 끝나야 하는 것과 재작업 위험
      description: >-
        이 화면보다 먼저 끝나야 하는 화면이나 공용 부품이 있으면 적는다. 없으면 `없음`.
        지금 만들면 나중에 다시 만들 가능성이 있는 부분도 함께 적는다 — 프론트가 착수 순서를 정하는 근거다.
      placeholder: |
        - 선행: W-06-01(버전 마스터 형 원형)이 먼저 끝나야 한다 — 버전 전환 UI를 그대로 재사용한다
        - 재작업 위험: 낮음. 목록 컬럼이 1~2개 늘 수 있으나 화면 구조는 바뀌지 않는다
    validations:
      required: true

  - type: textarea
    id: cautions
    attributes:
      label: 6. 특별히 조심할 것
      description: >-
        스펙만 읽어서는 놓치기 쉬운 것을 적는다 — 스펙 서술과 계약이 어긋나는 지점,
        실서버와 계약이 다른 지점, 겉보기와 다르게 동작하는 규칙 등. 없으면 비워 둔다.
      placeholder: |
        - 사용 중지 요청에도 `If-Match` 헤더가 필요하다 — 스펙 서술과 계약이 다르니 계약을 따른다
        - 409 응답의 원인 값은 3가지로 확정돼 있다. 「원인 미확정」이 아니다
        - 상태 코드 목록은 스펙에 예시가 하나뿐이지만 확정된 전체 목록이다

  - type: markdown
    attributes:
      value: |
        ---

        **이 이슈는 시점 기록이다.** 올린 뒤에는 본문을 고치지 않는다.
        착수 후 설계가 바뀌면 `[uiux→client]` **⛔/⚠ 변경 통지**를 **새 이슈**로 올리고 이 이슈를 링크한다.
        이슈를 닫는 것은 프론트다 — 미결 항목을 실제로 어떻게 처리했는지 남기고 닫는다.
