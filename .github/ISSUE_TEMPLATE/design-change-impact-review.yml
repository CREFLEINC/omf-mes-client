name: 설계 변동 영향 검토
description: 공통 설계 변동 공지 수신 후 클라이언트 영향과 재검토 결과만 기록합니다.
title: '[설계 변동 영향 검토] '
labels:
  - 'Agent : Client'
body:
  - type: markdown
    attributes:
      value: |
        이 이슈는 설계 변동 공지가 아닙니다. 백엔드·클라이언트를 구분하지 않는 공통 공지의 외부 정본을 참조하고 클라이언트 영향 검토만 기록합니다.
        공지 원문, 설계 본문, 이미지, 고객 정보는 복사하지 않습니다.

  - type: input
    id: notice-reference
    attributes:
      label: 공통 공지 참조
      description: 설계 저장소에 발행된 공통 공지의 GitHub 이슈 URL 또는 CREFLEINC/omf-mes#번호를 적습니다.
      placeholder: CREFLEINC/omf-mes#123
    validations:
      required: true

  - type: input
    id: baseline-transition
    attributes:
      label: 설계 기준 변경
      description: 이전 커밋과 공지에서 지정한 새 커밋만 적습니다.
      placeholder: <이전 전체 커밋> → <새 전체 커밋>
    validations:
      required: true

  - type: textarea
    id: affected-work
    attributes:
      label: 영향받는 클라이언트 작업
      description: 관련 이슈 번호와 계획 포인터만 적고 비공개 설계 내용은 적지 않습니다.
      placeholder: |
        - #123 — 계획 재검토 필요
    validations:
      required: true

  - type: dropdown
    id: review-result
    attributes:
      label: 전면 재검토 결과
      options:
        - 영향 있음 — 대응 계획 기록 완료
        - 영향 없음 — 검토 근거 포인터 기록 완료
    validations:
      required: true

  - type: checkboxes
    id: boundary-confirmed
    attributes:
      label: 업무 경계 확인
      options:
        - label: 공지가 모든 개발팀을 대상으로 한 공통 공지임을 확인했습니다.
          required: true
        - label: 공지 원문이나 비공개 설계 내용을 이 이슈에 복사하지 않았습니다.
          required: true
        - label: 진행 중인 계획·코드 설계·검증 계획을 전면 재검토했습니다.
          required: true
