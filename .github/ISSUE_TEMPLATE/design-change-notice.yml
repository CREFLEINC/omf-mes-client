name: 설계 변동 공지
description: 설계팀이 고정된 설계 기준의 변경 사실만 알립니다. 변경 상세는 적지 않습니다.
title: '[설계 변동 공지] '
labels:
  - 'design-change-notice'
body:
  - type: markdown
    attributes:
      value: |
        이 이슈는 설계팀에서 개발팀으로 허용된 유일한 직접 통지입니다.
        공개 저장소이므로 변경 상세, 설계 본문, 이미지, 고객 정보는 적지 않습니다.

  - type: input
    id: published-at
    attributes:
      label: 공지 발행일
      placeholder: '2026-09-03'
    validations:
      required: true

  - type: input
    id: release-commit
    attributes:
      label: 배포 버전
      description: 설계 저장소의 전체 커밋 해시를 적습니다.
      placeholder: 40자리 commit hash
    validations:
      required: true

  - type: textarea
    id: artifacts
    attributes:
      label: 설계 자료 목록
      description: 최종 결과물의 참조 경로와 공지 시점 파일 버전만 적습니다.
      placeholder: |
        - <자료 경로> — <파일 버전>
    validations:
      required: true

  - type: textarea
    id: changed-locations
    attributes:
      label: 이전 버전과 달라진 지점
      description: 무엇이 어떻게 바뀌었는지가 아니라 어느 자료의 어느 항목이 바뀌었는지만 적습니다.
      placeholder: |
        - <자료/항목>의 데이터 구조가 변경됨
    validations:
      required: true

  - type: checkboxes
    id: no-details
    attributes:
      label: 공개 경계 확인
      options:
        - label: 변경 상세·설계 본문·이미지·고객 정보를 포함하지 않았습니다.
          required: true
