name: Front image

on:
  push:
    tags:
      - 'web-v*.*.*'

permissions:
  contents: read

concurrency:
  group: front-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push
    runs-on: [self-hosted, Linux, X64, omf-mes-front]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release commit belongs to main
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" refs/remotes/origin/main || {
            printf 'Release tag must point to a commit contained in main.\n' >&2
            exit 1
          }

      - name: Resolve image tags
        id: image
        env:
          IMAGE_REPOSITORY: ${{ secrets.FRONT_IMAGE_REPOSITORY }}
          REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
        shell: bash
        run: tools/deploy/resolve-image-tags.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            VITE_API_BASE_URL=/api
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
